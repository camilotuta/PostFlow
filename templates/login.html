<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostFlow · Login</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260314-3" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f0f12;
        padding: 20px;
      }
      .login-wrap {
        width: 100%;
        max-width: 430px;
      }
      .login-title {
        margin: 0 0 14px;
        font-size: 24px;
        font-weight: 700;
      }
      .login-sub {
        margin: 0 0 22px;
        opacity: 0.8;
        font-size: 14px;
      }
      .login-error {
        margin: 0 0 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 85, 85, 0.14);
        border: 1px solid rgba(255, 85, 85, 0.35);
        color: #ffd5d5;
        font-size: 13px;
      }
      .login-form {
        display: grid;
        gap: 14px;
      }
      .login-actions {
        display: flex;
        justify-content: flex-end;
      }
      .login-links {
        margin-top: 14px;
        display: flex;
        gap: 10px;
        font-size: 13px;
        opacity: 0.8;
      }
      .login-links a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap card">
      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-sub">
        Elige tu cuenta y contraseña para entrar a tu panel.
      </p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form class="login-form" method="POST" action="/login">
        <div>
          <label class="form-label" for="brand">Cuenta</label>
          <select id="brand" name="brand" class="form-input" required>
            {% for key, info in brands.items() %}
            <option value="{{ key }}">{{ info.label }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="form-label" for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="login-actions">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </div>
      </form>

      <div class="login-links">
        <a href="/terms">Términos</a>
        <span>·</span>
        <a href="/privacy">Privacidad</a>
      </div>
    </div>
  </body>
</html>
